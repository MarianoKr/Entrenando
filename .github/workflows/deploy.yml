name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # O 'master', según cómo se llame tu rama principal

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Si usas React / Vite / Vue / Node.js descomenta estas líneas:
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build project
      #   run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ENTRENANDO_8A141 }}'
          projectId: entrenando-8a141
          channelId: live
